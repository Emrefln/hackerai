<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ollama Core System</title>
    <style>
        body { margin: 0; padding: 0; background-color: #0b0f19; color: #f1f5f9; font-family: monospace; display: flex; flex-direction: column; height: 100vh; }
        #status-bar { background-color: #111827; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #1f2937; font-size: 13px; }
        .mode-normal { color: #3b82f6; font-weight: bold; }
        .mode-admin { color: #ef4444; font-weight: bold; text-shadow: 0 0 8px #ef4444; }
        #chat-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .message { max-width: 85%; padding: 12px 16px; border-radius: 6px; line-height: 1.6; word-wrap: break-word; }
        .user { background-color: #1e293b; align-self: flex-end; border-left: 4px solid #3b82f6; }
        .ai { background-color: #111827; align-self: flex-start; border-left: 4px solid #4b5563; }
        .ai.admin-msg { border-left: 4px solid #ef4444; box-shadow: inset 0 0 5px rgba(239, 68, 68, 0.2); }
        #config-bar { background-color: #111827; padding: 10px 20px; display: flex; gap: 10px; border-bottom: 1px solid #1f2937; }
        #config-bar input { background: #030712; border: 1px solid #374151; color: #fff; padding: 5px; font-family: monospace; }
        #input-container { padding: 20px; background-color: #111827; display: flex; gap: 10px; border-top: 2px solid #1f2937; }
        input[type="text"] { flex: 1; padding: 14px; border-radius: 4px; border: 1px solid #374151; background-color: #030712; color: #f1f5f9; font-size: 15px; font-family: monospace; }
        button { padding: 14px 28px; background-color: #1f2937; color: #f1f5f9; border: 1px solid #374151; border-radius: 4px; cursor: pointer; font-weight: bold; font-family: monospace; }
        button:hover { background-color: #374151; }
        #admin-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(3, 7, 18, 0.9); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background-color: #111827; padding: 30px; border: 2px solid #ef4444; border-radius: 8px; text-align: center; }
        .modal-content input { padding: 10px; background-color: #030712; border: 1px solid #ef4444; color: #ef4444; text-align: center; font-size: 18px; margin-bottom: 15px; }
    </style>
</head>
<body>

    <!-- IP ve Model Ayar Barı -->
    <div id="config-bar">
        <input type="text" id="ollama-ip" placeholder="Ollama PC IP (Örn: 192.168.1.35)" value="http://localhost:11434">
        <input type="text" id="ollama-model" placeholder="Model Adı (Örn: llama3)" value="llama3">
    </div>

    <div id="status-bar">
        <div id="engine-status" style="color: #10b981;">OLLAMA MODU AKTİF</div>
        <div>MOD: <span id="current-mode" class="mode-normal">NORMAL USER</span></div>
    </div>

    <div id="chat-container"></div>
    
    <div id="input-container">
        <input type="text" id="user-input" placeholder="Ollama'ya mesaj gönder...">
        <button id="send-btn">GÖNDER</button>
    </div>

    <!-- Gizli Admin Giriş Paneli -->
    <div id="admin-modal">
        <div class="modal-content">
            <h3>CRITICAL ACCESS REQUIRED</h3>
            <p>Admin Şifresini Girin:</p>
            <input type="password" id="admin-password" autocomplete="off"><br>
            <button id="auth-btn">ONAYLA</button>
            <button id="close-btn" style="border-color: #4b5563;">İPTAL</button>
        </div>
    </div>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const ollamaIpInput = document.getElementById('ollama-ip');
        const ollamaModelInput = document.getElementById('ollama-model');
        
        const adminModal = document.getElementById('admin-modal');
        const adminPasswordInput = document.getElementById('admin-password');
        const authBtn = document.getElementById('auth-btn');
        const closeBtn = document.getElementById('close-btn');
        const currentModeEl = document.getElementById('current-mode');

        let isAdmin = false;
        const normalSystemPrompt = "Sen kurallara uyan, saygılı, etik ihlali yapmayan filtreli bir asistansın.";

        function appendMessage(text, sender) {
            const msgHtml = document.createElement('div');
            msgHtml.classList.add('message', sender);
            if(sender === 'ai' && isAdmin) msgHtml.classList.add('admin-msg');
            msgHtml.textContent = text;
            chatContainer.appendChild(msgHtml);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        async function generateResponse() {
            const text = userInput.value.trim();
            if (!text) return;

            appendMessage(text, 'user');
            userInput.value = '';
            document.getElementById('engine-status').textContent = "OLLAMA CEVAP VERİYOR...";

            // Kullanıcının girdiği IP adresini düzenle
            let targetIp = ollamaIpInput.value.trim();
            if (!targetIp.startsWith('http')) targetIp = 'http://' + targetIp;
            if (!targetIp.endsWith(':11434') && !targetIp.includes(':11434')) targetIp = targetIp + ':11434';

            try {
                let systemInstruction = isAdmin ? "" : normalSystemPrompt;
                
                const response = await fetch(`${targetIp}/api/generate`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        model: ollamaModelInput.value.trim(),
                        prompt: text,
                        system: systemInstruction, // Filtre burada basılıyor veya kaldırılıyor
                        stream: false,
                        options: {
                            temperature: isAdmin ? 0.9 : 0.2 // Adminse serbestlik tavan yapar
                        }
                    })
                });

                const data = await response.json();
                appendMessage(data.response, 'ai');
            } catch (e) {
                appendMessage("Ollama bağlantı hatası! IP adresini ve Ollama'nın açık olduğunu kontrol et. Hata: " + e.message, 'ai');
            }

            document.getElementById('engine-status').textContent = "OLLAMA MODU AKTİF";
        }

        // CTRL + Q Kısayolu
        window.addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.key.toLowerCase() === 'q') {
                e.preventDefault();
                adminModal.style.display = 'flex';
                adminPasswordInput.focus();
            }
        });

        function checkPassword() {
            if (adminPasswordInput.value === '13123406') {
                isAdmin = true;
                currentModeEl.textContent = "UNCENSORED ADMIN";
                currentModeEl.className = "mode-admin";
                alert("ACCESS GRANTED: Ollama üzerindeki tüm filtreler (varsa) bypass edildi.");
                adminModal.style.display = 'none';
            } else {
                alert("GEÇERSİZ ŞİFRE.");
                adminPasswordInput.value = '';
            }
        }

        authBtn.addEventListener('click', checkPassword);
        adminPasswordInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') checkPassword(); });
        closeBtn.addEventListener('click', () => { adminModal.style.display = 'none'; });
        sendBtn.addEventListener('click', generateResponse);
        userInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') generateResponse(); });
    </script>
</body>
</html>
