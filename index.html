<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HackerAI - Qwen Premium v4</title>
    <style>
        :root {
            --bg-main: #131314;
            --bg-sidebar: #1e1f20;
            --bg-input: #282a2c;
            --text-main: #e3e3e3;
            --accent: #ef4444;
            --user-msg: #2b2a2a;
            --code-bg: #0f0f10;
        }
        body { margin: 0; padding: 0; background-color: var(--bg-main); color: var(--text-main); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; height: 100vh; overflow: hidden; }
        
        /* Auth Ekranı */
        #auth-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-main); z-index: 10000; display: flex; justify-content: center; align-items: center; }
        .auth-box { background: var(--bg-sidebar); padding: 40px; border-radius: 16px; border: 1px solid #3c4043; width: 340px; text-align: center; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
        .auth-box h2 { margin-top: 0; color: #fff; letter-spacing: 1px; }
        .auth-box input { width: 100%; padding: 12px; margin: 8px 0; background: var(--bg-main); border: 1px solid #3c4043; color: white; border-radius: 8px; box-sizing: border-box; font-size: 14px; }
        .auth-box input:focus { border-color: #888; outline: none; }
        .auth-btn { width: 100%; padding: 12px; background: #fff; color: #000; border: none; border-radius: 24px; font-weight: bold; cursor: pointer; margin-top: 10px; font-size: 14px; }
        .auth-btn:hover { background: #e3e3e3; }
        
        .google-btn { width: 100%; padding: 12px; background: #fff; color: #3c4043; border: 1px solid #c4c7c5; border-radius: 24px; font-weight: bold; cursor: pointer; margin-top: 12px; font-size: 14px; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .google-btn:hover { background: #f7f9f9; }
        .divider { color: #8e918f; font-size: 13px; margin: 15px 0; display: flex; align-items: center; justify-content: center; }
        .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: #3c4043; margin: 0 10px; }
        .toggle-link { color: #8e918f; font-size: 13px; margin-top: 15px; display: inline-block; cursor: pointer; text-decoration: underline; }

        /* Sol Menü */
        #sidebar { width: 260px; background-color: var(--bg-sidebar); display: flex; flex-direction: column; padding: 15px; border-right: 1px solid #3c4043; }
        .new-chat-btn { background: #1a1a1a; border: 1px solid #5f6368; color: white; padding: 12px; border-radius: 24px; cursor: pointer; text-align: center; font-weight: bold; margin-bottom: 20px; font-family: inherit; }
        .new-chat-btn:hover { background: #2d2e30; }
        #history-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        .history-item { padding: 10px 15px; border-radius: 8px; cursor: pointer; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background: transparent; transition: 0.2s; }
        .history-item.active { background: #2d2e30; border-left: 3px solid var(--accent); }
        .history-item:hover { background: #2d2e30; }
        .logout-btn { background: transparent; border: 1px solid #ef4444; color: #ef4444; padding: 8px; border-radius: 18px; cursor: pointer; margin-top: 10px; font-weight: bold; }
        .logout-btn:hover { background: rgba(239, 68, 68, 0.1); }
        .sidebar-footer { font-size: 12px; color: #9aa0a6; text-align: center; padding-top: 10px; border-top: 1px solid #3c4043; font-family: monospace; }

        /* Ana İçerik */
        #main-content { flex: 1; display: flex; flex-direction: column; height: 100vh; position: relative; }
        #top-bar { padding: 15px 25px; display: flex; justify-content: space-between; align-items: center; background: var(--bg-main); border-bottom: 1px solid #3c4043; }
        #chat-window { flex: 1; overflow-y: auto; padding: 30px 10% 120px 10%; display: flex; flex-direction: column; gap: 25px; }
        
        .message-row { display: flex; flex-direction: column; width: 100%; }
        .message { max-width: 85%; padding: 15px 20px; border-radius: 12px; line-height: 1.6; font-size: 16px; word-wrap: break-word; }
        .user-row { align-items: flex-end; }
        .user-row .message { background-color: var(--user-msg); border-radius: 18px 18px 4px 18px; white-space: pre-wrap; }
        .ai-row { align-items: flex-start; }
        .ai-row .message { background-color: transparent; padding-left: 0; width: 100%; }
        .ai-row.admin-mode-active .message { border-left: 3px solid var(--accent); padding-left: 15px; }
        
        .uploaded-img { max-width: 300px; max-height: 300px; border-radius: 8px; margin-top: 10px; border: 1px solid #3c4043; }

        pre { background: var(--code-bg); padding: 15px; border-radius: 8px; overflow-x: auto; position: relative; border: 1px solid #3c4043; margin: 10px 0; font-family: 'Consolas', monospace; }
        .copy-btn { position: absolute; top: 8px; right: 8px; background: #282a2c; color: #e3e3e3; border: 1px solid #3c4043; padding: 4px 8px; border-radius: 4px; font-size: 12px; cursor: pointer; }
        .copy-btn:hover { background: #353739; }

        #input-area-container { position: absolute; bottom: 0; left: 0; right: 0; background: linear-gradient(transparent, var(--bg-main) 30%); padding: 20px 10% 30px 10%; }
        #input-wrapper { background-color: var(--bg-input); border-radius: 32px; padding: 8px 20px; display: flex; align-items: center; gap: 12px; }
        textarea { flex: 1; background: transparent; border: none; color: var(--text-main); font-size: 16px; outline: none; resize: none; height: 24px; font-family: inherit; }
        .icon-btn { background: transparent; border: none; color: #c4c7c5; cursor: pointer; padding: 8px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .icon-btn:hover { background-color: #353739; color: white; }
        
        #admin-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; z-index: 9999; }
        .modal-box { background: #1e1f20; padding: 30px; border-radius: 12px; border: 1px solid var(--accent); text-align: center; }
        .modal-box input { background: #131314; border: 1px solid var(--accent); color: white; padding: 10px; font-size: 16px; text-align: center; margin-bottom: 15px; border-radius: 4px; }
    </style>
</head>
<body>

    <div id="auth-container">
        <div class="auth-box">
            <h2 id="auth-title">HackerAI Giriş</h2>
            <button class="google-btn" id="google-login-btn">
                <svg width="18" height="18" viewBox="0 0 18 18"><path d="M17.64 9.2c0-.63-.06-1.25-.16-1.84H9v3.47h4.84c-.21 1.12-.84 2.07-1.79 2.7l2.78 2.16c1.63-1.5 2.57-3.7 2.57-6.3h-.1z" fill="#4285F4"/><path d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.78-2.16c-.77.52-1.76.83-2.92.83-2.25 0-4.16-1.52-4.84-3.57L1.57 13c1.48 2.95 4.53 5 8.1 5z" fill="#34A853"/><path d="M4.16 10.92c-.17-.52-.27-1.07-.27-1.64s.1-1.12.27-1.64V5.47L1.31 3.73C.47 5.42 0 7.3 0 9.3s.47 3.88 1.31 5.57l2.85-2.23-.0z" fill="#FBBC05"/><path d="M9 3.58c1.32 0 2.5.45 3.44 1.35L15 2.4C13.46.98 11.42 0 9 0 5.43 0 2.38 2.05.9 5z" fill="#EA4335"/></svg>
                Google ile Devam Et
            </button>
            <div class="divider">veya</div>
            <input type="email" id="auth-email" placeholder="E-posta Adresi">
            <input type="password" id="auth-password" placeholder="Şifre">
            <button class="auth-btn" id="auth-submit-btn">Giriş Yap</button>
            <span class="toggle-link" id="auth-toggle">Hesabın yok mu? Kayıt Ol</span>
        </div>
    </div>

    <div id="sidebar">
        <button class="new-chat-btn" id="new-chat-btn">+ Yeni Sohbet</button>
        <div id="history-list"></div>
        <button class="logout-btn" id="logout-btn">Oturumu Kapat</button>
        <div class="sidebar-footer">HackerAI Core v4 // Ctrl+Q</div>
    </div>

    <div id="main-content">
        <div id="top-bar">
            <div style="font-weight: bold; font-size: 18px; letter-spacing: 1px;">HackerAI</div>
            <div id="status-indicator" style="color: #8e918f; font-size: 14px;">Sistem: Hazır</div>
        </div>
        <div id="chat-window"></div>
        <div id="input-area-container">
            <div id="input-wrapper">
                <label class="icon-btn" title="Görsel Yükle">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M19 5v14H5V5h14m0-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-4.86 8.86l-3 3.87L9 13.14 6 17h12l-3.86-5.14z"/></svg>
                    <input type="file" id="image-input" accept="image/*" style="display: none;">
                </label>
                <textarea id="user-prompt" placeholder="Qwen'a bir şeyler sor..."></textarea>
                <button class="icon-btn" id="send-btn" title="Gönder">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
                </button>
            </div>
            <div id="preview-area" style="margin-top: 8px; padding-left: 20px;"></div>
        </div>
    </div>

    <div id="admin-modal">
        <div class="modal-box">
            <h3 style="color: var(--accent); margin-top:0; font-family: monospace;">CRITICAL ACCESS</h3>
            <input type="password" id="admin-pass" placeholder="Şifre">
            <br>
            <button class="new-chat-btn" id="auth-btn" style="background: var(--accent); border:none; padding: 8px 20px; margin:0;">Giriş Yap</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

        // Senin Firebase Proje Bilgilerin
        const firebaseConfig = {
            apiKey: "AIzaSyDHLts0hwnw1TzCddyAKb4vwrfWxaPGQAA",
            authDomain: "hackerai-93c7d.firebaseapp.com",
            projectId: "hackerai-93c7d",
            storageBucket: "hackerai-93c7d.firebasestorage.app",
            messagingSenderId: "644965623288",
            appId: "1:644965623288:web:3e3f8514da4ddc7f58e20d",
            measurementId: "G-SFBXHW3PJ2"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const googleProvider = new GoogleAuthProvider();

        // Tarayıcı Engellerini Aşmak İçin Localhost / 127.0.0.1 Kullanıyoruz
        const OLLAMA_TARGET = "http://127.0.0.1:11434"; 
        const DEFAULT_MODEL = "qwen2.5:1.5b-instruct-q2_K"; 
        const VISION_MODEL = "qwen2.5-vl";

        const authContainer = document.getElementById('auth-container');
        const authTitle = document.getElementById('auth-title');
        const authEmail = document.getElementById('auth-email');
        const authPassword = document.getElementById('auth-password');
        const authSubmitBtn = document.getElementById('auth-submit-btn');
        const googleLoginBtn = document.getElementById('google-login-btn');
        const authToggle = document.getElementById('auth-toggle');
        const logoutBtn = document.getElementById('logout-btn');
        const chatWindow = document.getElementById('chat-window');
        const userPrompt = document.getElementById('user-prompt');
        const sendBtn = document.getElementById('send-btn');
        const imageInput = document.getElementById('image-input');
        const previewArea = document.getElementById('preview-area');
        const statusIndicator = document.getElementById('status-indicator');
        const historyList = document.getElementById('history-list');
        const newChatBtn = document.getElementById('new-chat-btn');
        const adminModal = document.getElementById('admin-modal');
        const adminPass = document.getElementById('admin-pass');
        const authBtn = document.getElementById('auth-btn');

        let currentUser = null;
        let isSignUpMode = false;
        let isAdmin = false;
        let selectedImageBase64 = null;
        let currentChatId = null;
        let userChats = {}; // Tüm sohbetlerin tutulduğu ana nesne

        googleLoginBtn.addEventListener('click', async () => {
            try { await signInWithPopup(auth, googleProvider); } catch (err) { alert("Google Hata: " + err.message); }
        });

        authToggle.addEventListener('click', () => {
            isSignUpMode = !isSignUpMode;
            authTitle.textContent = isSignUpMode ? "HackerAI Kayıt Ol" : "HackerAI Giriş";
            authSubmitBtn.textContent = isSignUpMode ? "Kayıt Ol" : "Giriş Yap";
            authToggle.textContent = isSignUpMode ? "Zaten hesabın var mı? Giriş Yap" : "Hesabın yok mu? Kayıt Ol";
        });

        authSubmitBtn.addEventListener('click', async () => {
            const email = authEmail.value.trim();
            const password = authPassword.value.trim();
            if(!email || !password) return alert("Boş alan bırakılamaz.");
            try {
                if(isSignUpMode) {
                    await createUserWithEmailAndPassword(auth, email, password);
                    alert("Kayıt başarılı!");
                } else { await signInWithEmailAndPassword(auth, email, password); }
            } catch (err) { alert("Hata: " + err.message); }
        });

        logoutBtn.addEventListener('click', () => signOut(auth));

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                authContainer.style.display = 'none';
                await loadChatsFromFirebase();
            } else {
                currentUser = null;
                authContainer.style.display = 'flex';
                chatWindow.innerHTML = '';
                historyList.innerHTML = '';
                userChats = {};
                currentChatId = null;
            }
        });

        // Verileri Buluttan Çekme (MESAJLARIN KALMASINI SAĞLAYAN KISIM)
        async function loadChatsFromFirebase() {
            if(!currentUser) return;
            statusIndicator.textContent = "Bulut yükleniyor...";
            try {
                const docRef = doc(db, "users", currentUser.uid);
                const docSnap = await getDoc(docRef);
                
                if (docSnap.exists() && docSnap.data().chats) {
                    userChats = docSnap.data().chats;
                } else {
                    userChats = {};
                }
                
                renderHistory();
                
                // Eğer daha önceden kalan sohbet varsa son sohbeti yükle, yoksa yeni aç
                const keys = Object.keys(userChats);
                if (keys.length > 0) {
                    currentChatId = keys[keys.length - 1];
                    loadChat(currentChatId);
                } else { 
                    startNewChat(); 
                }
            } catch (e) { 
                console.error("Firebase veri yükleme hatası:", e); 
            }
            statusIndicator.textContent = isAdmin ? "Sistem: Uncensored Admin" : "Sistem: Filtreli (Normal)";
        }

        // Verileri Buluta Yedekleme
        async function syncWithFirebase() {
            if(!currentUser) return;
            try { 
                const docRef = doc(db, "users", currentUser.uid);
                await setDoc(docRef, { chats: userChats }, { merge: true }); 
            } catch (e) { 
                console.error("Firebase senkronizasyon hatası:", e); 
            }
        }

        userPrompt.addEventListener('input', function() {
            this.style.height = '24px';
            this.style.height = (this.scrollHeight - 10) + 'px';
        });

        imageInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(event) {
                selectedImageBase64 = event.target.result.split(',')[1];
                previewArea.innerHTML = `<span style="color:#8e918f; font-size:14px;">📎 Analiz Kuyruğunda: ${file.name}</span>`;
            };
            reader.readAsDataURL(file);
        });

        // Sol Menüdeki Geçmişi Çizdirme
        function renderHistory() {
            historyList.innerHTML = '';
            Object.keys(userChats).reverse().forEach(id => {
                const item = document.createElement('div');
                item.classList.add('history-item');
                if(id === currentChatId) item.classList.add('active');
                item.textContent = userChats[id].title || "Yeni Sohbet";
                item.onclick = () => loadChat(id);
                historyList.appendChild(item);
            });
        }

        function startNewChat() {
            currentChatId = 'chat_' + Date.now();
            userChats[currentChatId] = { title: "Yeni Sohbet", messages: [] };
            chatWindow.innerHTML = '';
            renderHistory();
            syncWithFirebase();
        }

        function loadChat(id) {
            currentChatId = id;
            chatWindow.innerHTML = '';
            renderHistory();
            if(userChats[id] && userChats[id].messages) {
                userChats[id].messages.forEach(msg => {
                    appendMessageToUI(msg.text, msg.sender, msg.imgData);
                });
            }
        }

        function formatAIResponse(rawText) {
            const codeBlockRegex = /```(\w*)\n([\s\S]*?)```/g;
            let formatted = rawText;
            if (!rawText.includes('```')) {
                const safeDiv = document.createElement('div');
                safeDiv.textContent = rawText;
                return safeDiv.innerHTML.replace(/\n/g, '<br>');
            }
            formatted = formatted.replace(codeBlockRegex, (match, lang, code) => {
                const uniqueId = 'code_' + Math.random().toString(36).substr(2, 9);
                const escapedCode = code.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                return `<pre><button class="copy-btn" onclick="window.copyToClipboard('${uniqueId}')">Kopyala</button><code id="${uniqueId}">${escapedCode}</code></pre>`;
            });
            return formatted.replace(/\n/g, '<br>').replace(/<\/pre><br>/g, '</pre>');
        }

        window.copyToClipboard = function(id) {
            const codeText = document.getElementById(id).innerText;
            navigator.clipboard.writeText(codeText).then(() => { alert("Kod kopyalandı!"); });
        };

        function appendMessageToUI(text, sender, imgData = null) {
            const row = document.createElement('div');
            row.classList.add('message-row', `${sender}-row`);
            if(sender === 'ai' && isAdmin) row.classList.add('admin-mode-active');

            const msgDiv = document.createElement('div');
            msgDiv.classList.add('message');

            if(sender === 'ai') {
                msgDiv.innerHTML = formatAIResponse(text);
            } else {
                msgDiv.textContent = text;
            }

            if (imgData) {
                const img = document.createElement('img');
                img.src = `data:image/jpeg;base64,${imgData}`;
                img.classList.add('uploaded-img');
                msgDiv.appendChild(img);
            }

            row.appendChild(msgDiv);
            chatWindow.appendChild(row);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        // BAŞLIĞI VE MESAJLARI KALICI YAPAN KRİTİK FONKSİYON
        async function handleSend() {
            const promptText = userPrompt.value.trim();
            if (!promptText && !selectedImageBase64) return;
            if (!currentUser) return alert("Oturum doğrulanmadı.");

            if (!currentChatId) startNewChat();

            // Kullanıcı mesajını yerel belleğe ve ekrana ekle
            userChats[currentChatId].messages.push({ sender: 'user', text: promptText, imgData: selectedImageBase64 });
            appendMessageToUI(promptText, 'user', selectedImageBase64);
            
            // Eğer ilk mesajsa sohbet konusunu otomatik güncelle (Senin istediğin gibi)
            if (userChats[currentChatId].messages.length === 1 || userChats[currentChatId].title === "Yeni Sohbet") {
                userChats[currentChatId].title = promptText.substring(0, 24) + (promptText.length > 24 ? "..." : "");
                renderHistory();
            }

            userPrompt.value = '';
            userPrompt.style.height = '24px';
            previewArea.innerHTML = '';
            statusIndicator.textContent = "Qwen düşünüyor...";

            try {
                const activeModel = selectedImageBase64 ? VISION_MODEL : DEFAULT_MODEL;
                const sysInstruction = isAdmin ? "" : "Sen kurallara uyan, filtreli, net kodlar ve cevaplar yazan bir yardımcı asistanısın.";

                const bodyPayload = {
                    model: activeModel,
                    prompt: promptText,
                    system: sysInstruction,
                    stream: false,
                    options: { temperature: isAdmin ? 0.90 : 0.2 }
                };

                if (selectedImageBase64) bodyPayload.images = [selectedImageBase64];

                const response = await fetch(`${OLLAMA_TARGET}/api/generate`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(bodyPayload)
                });

                if (!response.ok) throw new Error("Sunucu hatası");

                const data = await response.json();
                
                // Yapay zeka yanıtını belleğe ekle ve ekrana bas
                userChats[currentChatId].messages.push({ sender: 'ai', text: data.response });
                appendMessageToUI(data.response, 'ai');
                
                // Firebase'e kalıcı olarak fırlat
                await syncWithFirebase();

            } catch (error) {
                console.error(error);
                appendMessageToUI("Ollama Motoru Kapalı. Sunucuyu kontrol et. Termux'ta 'ollama serve' açık olduğundan emin ol.", 'ai');
            }
            
            statusIndicator.textContent = isAdmin ? "Sistem: Uncensored Admin" : "Sistem: Filtreli (Normal)";
            selectedImageBase64 = null;
        }

        window.addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.key.toLowerCase() === 'q') {
                e.preventDefault();
                adminModal.style.display = 'flex';
                adminPass.focus();
            }
        });

        authBtn.addEventListener('click', () => {
            if (adminPass.value === '13123406') {
                isAdmin = true;
                statusIndicator.textContent = "Sistem: Uncensored Admin";
                statusIndicator.style.color = "var(--accent)";
                alert("KÖKLÜ ERİŞİM İZNİ VERİLDİ.");
                adminModal.style.display = 'none';
            } else { alert("ERİŞİM ENGELLENDİ."); adminPass.value = ''; }
        });

        sendBtn.addEventListener('click', handleSend);
        userPrompt.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSend(); } });
        newChatBtn.addEventListener('click', startNewChat);
    </script>
</body>
</html>
